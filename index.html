
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa 1935 vs Google Satellite</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Leaflet and side-by-side plugin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@master/leaflet-side-by-side.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #eee;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      text-align: center;
      font-size: 14px;
      max-width: calc(100% - 120px);
    }

    .mode {
      position: absolute;
      top: 75px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      line-height: 1.8;
    }

    /* Side-by-side slider */
    .leaflet-sbs-range {
      z-index: 1000;
      cursor: ew-resize;
    }

    .leaflet-sbs-divider {
      z-index: 999;
    }

    @media (max-width: 600px) {
      .info {
        font-size: 12px;
        padding: 6px 8px;
      }

      .mode {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="info">
    <b>Mapa 1935 vs Google Satellite</b><br>
    Przeciągnij pionową linię, aby porównać obrazy.
  </div>

  <div class="mode">
    <label>
      <input type="radio" name="tileMode" value="xyz" checked>
      Kafelki XYZ
    </label>
    <br>
    <label>
      <input type="radio" name="tileMode" value="tms">
      Kafelki TMS
    </label>
  </div>

  <script>
    // Check that Leaflet loaded.
    if (typeof L === "undefined") {
      throw new Error("Leaflet failed to load.");
    }

    // Initialize map.
    const map = L.map("map", {
      center: [51.539, 21.068],
      zoom: 13,
      zoomControl: true
    });

    // Google satellite layer.
    const googleSatellite = L.tileLayer(
      "https://{s}.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}",
      {
        subdomains: ["mt0", "mt1", "mt2", "mt3"],
        minZoom: 0,
        maxZoom: 19,
        attribution: "Imagery © Google",
        crossOrigin: true
      }
    );

    googleSatellite.addTo(map);

    // Historical map and comparison control.
    let mapa1935 = null;
    let sideBySide = null;

    function createHistoricalLayer(mode) {
      return L.tileLayer(
        "./tiles_1935/{z}/{x}/{y}.png",
        {
          minZoom: 12,
          maxZoom: 18,
          tms: mode === "tms",
          attribution: "Mapa topograficzna 1935",
          keepBuffer: 4
        }
      );
    }

    function setupComparison(mode) {
      // Remove the previous comparison control.
      if (sideBySide) {
        map.removeControl(sideBySide);
        sideBySide = null;
      }

      // Remove the previous historical layer.
      if (mapa1935) {
        map.removeLayer(mapa1935);
        mapa1935 = null;
      }

      // Create historical tiles using the selected indexing scheme.
      mapa1935 = createHistoricalLayer(mode);
      mapa1935.addTo(map);

      // Initialize slider:
      // left = historical map, right = satellite imagery.
      if (typeof L.control.sideBySide !== "function") {
        console.error(
          "Side-by-side plugin failed to load. Check the CDN request."
        );
        return;
      }

      sideBySide = L.control.sideBySide(
        mapa1935,
        googleSatellite
      );

      sideBySide.addTo(map);

      console.log("Comparison initialized:", mode);
    }

    // Initial setup.
    setupComparison("xyz");

    // Toggle between XYZ and TMS tile indexing.
    document.querySelectorAll(
      'input[name="tileMode"]'
    ).forEach(input => {
      input.addEventListener("change", function (event) {
        if (event.target.checked) {
          setupComparison(event.target.value);
        }
      });
    });

    // Study area.
    map.fitBounds([
      [51.4859, 20.9500],
      [51.5925, 21.1853]
    ]);

    // Log satellite tile errors for debugging.
    googleSatellite.on("tileerror", function (event) {
      console.error(
        "Satellite tile failed to load:",
        event.tile.src
      );
    });

    // Report failed historical tiles.
    map.on("layeradd", function (event) {
      if (event.layer === mapa1935) {
        console.log("Historical map layer added.");
      }
    });
  </script>
</body>
</html>

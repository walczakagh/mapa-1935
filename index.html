<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa 1935 - Porównanie</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Side-by-Side Plugin -->
    <script src="https://unpkg.com/leaflet-side-by-side@2.2.0/leaflet-side-by-side.min.js"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Naprawa klikalności i przeciągania suwaka */
        .leaflet-sbs-range {
            z-index: 9999 !important;
            pointer-events: auto !important;
            cursor: ew-resize !important;
        }
        .leaflet-sbs-divider {
            z-index: 9998 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Inicjalizacja mapy (np. środek Polski lub współrzędne Twojej mapy)
        var map = L.map('map').setView([52.0, 19.0], 13);

        // 1. Warstwa współczesna (podkładowa OSM)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // 2. Twoja warstwa historyczna 1935
        var mapa1935 = L.tileLayer('./tiles_1935/{z}/{x}/{y}.png', {
            minZoom: 12,
            maxZoom: 17,
            attribution: 'Mapa 1935'
        }).addTo(map);

        // 3. Kontrolka Side-by-Side
        var sideBySide = L.control.sideBySide(mapa1935, osm).addTo(map);
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa 1935 vs Google Satellite</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #eee;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      text-align: center;
      font-size: 14px;
      max-width: calc(100% - 100px);
      pointer-events: none;
    }

    .mode {
      position: absolute;
      top: 75px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .info {
        font-size: 12px;
        padding: 6px 8px;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="info">
    <b>Mapa 1935 vs Google Satellite</b><br>
    Przeciągnij pionową linię, aby porównać obrazy.
  </div>

  <div class="mode">
    <label>
      <input type="radio" name="tileMode" value="xyz" checked>
      Kafelki XYZ
    </label>
    <br>
    <label>
      <input type="radio" name="tileMode" value="tms">
      Kafelki TMS
    </label>
  </div>

  <!-- Load libraries before initializing the map -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@master/leaflet-side-by-side.js"></script>

  <script>
    // Verify library loading.
    if (typeof L === "undefined") {
      throw new Error("Leaflet could not be loaded.");
    }

    if (typeof L.control.sideBySide !== "function") {
      throw new Error(
        "Leaflet Side-by-Side plugin could not be loaded."
      );
    }

    // Initialize map.
    const map = L.map("map", {
      center: [51.539, 21.068],
      zoom: 13
    });

    // Google Satellite layer.
    const googleSatellite = L.tileLayer(
      "https://mt{s}.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}",
      {
        subdomains: ["0", "1", "2", "3"],
        minZoom: 0,
        maxZoom: 19,
        attribution: "Imagery © Google"
      }
    ).addTo(map);

    let mapa1935 = null;
    let sideBySide = null;

    // Create the historical map layer.
    function createHistoricalLayer(mode) {
      return L.tileLayer(
        "./tiles_1935/{z}/{x}/{y}.png",
        {
          minZoom: 12,
          maxZoom: 18,
          tms: mode === "tms",
          attribution: "Mapa topograficzna 1935",
          keepBuffer: 4
        }
      );
    }

    // Set up or reset the comparison slider.
    function setupComparison(mode) {
      // Remove the old slider control.
      if (sideBySide) {
        map.removeControl(sideBySide);
        sideBySide = null;
      }

      // Remove the previous historical layer.
      if (mapa1935) {
        map.removeLayer(mapa1935);
        mapa1935 = null;
      }

      // Add the new historical layer.
      mapa1935 = createHistoricalLayer(mode);
      mapa1935.addTo(map);

      // Historical map on the left.
      // Satellite imagery on the right.
      sideBySide = L.control.sideBySide(
        mapa1935,
        googleSatellite
      );

      sideBySide.addTo(map);
    }

    // Initial slider.
    setupComparison("xyz");

    // Switch between XYZ and TMS.
    document.querySelectorAll(
      'input[name="tileMode"]'
    ).forEach(function (input) {
      input.addEventListener("change", function (event) {
        if (event.target.checked) {
          setupComparison(event.target.value);
        }
      });
    });

    // Zoom to the study area.
    map.fitBounds([
      [51.4859, 20.9500],
      [51.5925, 21.1853]
    ]);

    // Log tile loading problems in the browser console.
    googleSatellite.on("tileerror", function (event) {
      console.error("Google Satellite tile error:", event.tile.src);
    });

    googleSatellite.on("tileload", function () {
      console.log("Google Satellite tile loaded.");
    });
  </script>
</body>
</html>

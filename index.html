<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa 1935 vs Google Satellite</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Plugin Side-by-Side -->
  <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@master/leaflet-side-by-side.js"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; }
    #map { position: absolute; inset: 0; }

    .info {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,255,255,.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      text-align: center;
      font-size: 14px;
    }

    .mode {
      position: absolute;
      top: 70px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="info">
    <b>Mapa 1935 vs Google Satellite</b><br>
    Przeciągnij pionową linię, aby porównać obrazy.
  </div>

  <div class="mode">
    <label>
      <input type="radio" name="tileMode" value="xyz" checked>
      Kafelki XYZ
    </label>
    <br>
    <label>
      <input type="radio" name="tileMode" value="tms">
      Kafelki TMS
    </label>
  </div>

  <script>
    // ---- Config ----------------------------------------------------------
    const BOUNDS = L.latLngBounds([51.4859, 20.9500], [51.5925, 21.1853]);
    const TILE_MIN_ZOOM = 12;   // lowest zoom you generated
    const TILE_MAX_ZOOM = 18;   // highest zoom you generated
    const MAP_MAX_ZOOM  = 19;   // user can zoom further (tiles get stretched)

    // ---- Map -------------------------------------------------------------
    const map = L.map('map', {
      minZoom: TILE_MIN_ZOOM,
      maxZoom: MAP_MAX_ZOOM,
      maxBounds: BOUNDS.pad(0.5)
    });

    // Right side: satellite
    const googleSatellite = L.tileLayer(
      'https://mt{s}.google.com/vt/lyrs=s&hl=pl&x={x}&y={y}&z={z}', {
        subdomains: ['0', '1', '2', '3'],
        maxZoom: MAP_MAX_ZOOM,
        attribution: 'Imagery &copy; Google'
      }
    ).addTo(map);

    // Alternative (ToS-friendlier) - swap in if you publish this:
    // const googleSatellite = L.tileLayer(
    //   'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    //     maxZoom: MAP_MAX_ZOOM,
    //     attribution: 'Imagery &copy; Esri'
    //   }
    // ).addTo(map);

    // Left side: historical map
    let mapa1935 = null;
    let sideBySide = null;

    function createHistoricalLayer(mode) {
      return L.tileLayer('./tiles_1935/{z}/{x}/{y}.png', {
        tms: mode === 'tms',
        minZoom: TILE_MIN_ZOOM,
        maxNativeZoom: TILE_MAX_ZOOM,  // overzoom beyond generated tiles
        maxZoom: MAP_MAX_ZOOM,
        bounds: BOUNDS,                // no 404 requests outside coverage
        attribution: 'Mapa topograficzna 1935'
      });
    }

    function setupComparison(mode) {
      if (!L.control.sideBySide) {
        document.querySelector('.info').innerHTML =
          '<b style="color:#c00">Nie załadowano wtyczki side-by-side.</b><br>Sprawdź konsolę (F12) i połączenie z CDN.';
        console.error('leaflet-side-by-side failed to load');
        return;
      }
      if (sideBySide) { map.removeControl(sideBySide); sideBySide = null; }
      if (mapa1935)   { map.removeLayer(mapa1935); }

      mapa1935 = createHistoricalLayer(mode).addTo(map);

      sideBySide = L.control.sideBySide(mapa1935, googleSatellite).addTo(map);
    }

    // ---- Init ------------------------------------------------------------
    map.fitBounds(BOUNDS);
    setupComparison('xyz');

    document.querySelectorAll('input[name="tileMode"]').forEach(input => {
      input.addEventListener('change', e => setupComparison(e.target.value));
    });
  </script>
</body>
</html>

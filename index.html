
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa 1935 vs Google Satellite</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #eee;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,255,255,.95);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      text-align: center;
      font-size: 14px;
      max-width: calc(100% - 100px);
    }

    .mode {
      position: absolute;
      top: 75px;
      left: 10px;
      z-index: 1000;
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      font-size: 13px;
      line-height: 1.8;
    }

    /* Keep the slider draggable above the map layers */
    .leaflet-sbs-range {
      z-index: 1000;
      cursor: ew-resize;
    }

    .leaflet-sbs-divider {
      z-index: 999;
    }
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/digidem/leaflet-side-by-side@master/leaflet-side-by-side.js"></script>
</head>

<body>
  <div id="map"></div>

  <div class="info">
    <b>Mapa 1935 vs Google Satellite</b><br>
    Przeciągnij pionową linię, aby porównać obrazy.
  </div>

  <div class="mode">
    <label>
      <input type="radio" name="tileMode" value="xyz" checked>
      Kafelki XYZ
    </label>
    <br>
    <label>
      <input type="radio" name="tileMode" value="tms">
      Kafelki TMS
    </label>
  </div>

  <script>
    // Check that both libraries loaded correctly.
    if (typeof L === "undefined") {
      throw new Error("Leaflet failed to load.");
    }

    if (typeof L.control.sideBySide !== "function") {
      throw new Error(
        "The side-by-side plugin failed to load. Check the CDN request."
      );
    }

    const map = L.map("map", {
      center: [51.539, 21.068],
      zoom: 13
    });

    // Google satellite imagery.
    const googleSatellite = L.tileLayer(
      "https://mt{s}.google.com/vt/lyrs=s&hl=pl&x={x}&y={y}&z={z}",
      {
        subdomains: ["0", "1", "2", "3"],
        minZoom: 0,
        maxZoom: 19,
        attribution: "Imagery © Google"
      }
    );

    googleSatellite.addTo(map);

    let mapa1935 = null;
    let sideBySide = null;

    function createHistoricalLayer(mode) {
      return L.tileLayer(
        "./tiles_1935/{z}/{x}/{y}.png",
        {
          minZoom: 12,
          maxZoom: 18,
          tms: mode === "tms",
          attribution: "Mapa topograficzna 1935",
          errorTileUrl: "",
          keepBuffer: 4
        }
      );
    }

    function setupComparison(mode) {
      // Remove the previous control and historical layer.
      if (sideBySide) {
        map.removeControl(sideBySide);
        sideBySide = null;
      }

      if (mapa1935) {
        map.removeLayer(mapa1935);
        mapa1935 = null;
      }

      // Create and add both layers before initializing the slider.
      mapa1935 = createHistoricalLayer(mode);
      mapa1935.addTo(map);

      // Historical map on the LEFT, satellite imagery on the RIGHT.
      sideBySide = L.control.sideBySide(
        mapa1935,
        googleSatellite
      );

      sideBySide.addTo(map);

      console.log("Comparison initialized. Tile mode:", mode);
    }

    // Initial comparison.
    setupComparison("xyz");

    // Switch between XYZ and TMS tile indexing.
    document.querySelectorAll(
      'input[name="tileMode"]'
    ).forEach(input => {
      input.addEventListener("change", event => {
        if (event.target.checked) {
          setupComparison(event.target.value);
        }
      });
    });

    // Original study area.
    map.fitBounds([
      [51.4859, 20.9500],
      [51.5925, 21.1853]
    ]);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mapa 1935 - Porównanie</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pionowa linia rozdzielająca */
        #divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            cursor: ew-resize;
            touch-action: none;
        }

        /* Uchwyt / kółko na środku linii */
        #divider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #ffffff;
            border: 3px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            pointer-events: none;
        }

        /* Niewidzialna strefa ułatwiająca chwycenie na telefonie */
        #divider::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: -20px;
            width: 44px;
            cursor: ew-resize;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="divider">
        <div id="divider-handle">◀▶</div>
    </div>

    <script>
        // 1. Inicjalizacja mapy
        var map = L.map('map').setView([52.23, 21.01], 13); // Wpisz współrzędne swojej mapy jeśli inne

        // 2. Warstwa podkładowa (OSM)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // 3. Twoja warstwa kafelków z 1935 r.
        var mapa1935 = L.tileLayer('./tiles_1935/{z}/{x}/{y}.png', {
            minZoom: 12,
            maxZoom: 17,
            attribution: 'Mapa 1935'
        }).addTo(map);

        var divider = document.getElementById('divider');
        var isDragging = false;
        var splitPosition = window.innerWidth / 2;

        function updateClip() {
            var mapContainer = map.getContainer();
            var rect = mapContainer.getBoundingClientRect();
            var x = splitPosition - rect.left;

            // Przycinanie warstwy 1935 od lewej strony do pozycji suwaka
            var layerElement = mapa1935.getContainer();
            if (layerElement) {
                var nw = map.containerPointToLayerPoint([0, 0]);
                var se = map.containerPointToLayerPoint([x, rect.height]);
                layerElement.style.clip = 'rect(' + nw.y + 'px, ' + se.x + 'px, ' + se.y + 'px, ' + nw.x + 'px)';
            }
            divider.style.left = splitPosition + 'px';
        }

        // Zdarzenia przycinania mapy
        map.on('move', updateClip);
        map.on('zoom', updateClip);
        mapa1935.on('load', updateClip);

        // Obsługa przeciągania suwaka (Mysz + Dotyk na telefonie)
        function startDrag(e) {
            isDragging = true;
            document.body.style.cursor = 'ew-resize';
            e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            splitPosition = Math.max(0, Math.min(window.innerWidth, clientX));
            updateClip();
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                document.body.style.cursor = '';
            }
        }

        divider.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);

        divider.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', doDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);

        window.addEventListener('resize', function() {
            splitPosition = window.innerWidth / 2;
            updateClip();
        });

        // Pierwsze wywołanie
        updateClip();
    </script>
</body>
</html>
